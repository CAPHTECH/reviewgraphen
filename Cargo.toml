[workspace]
members = [
    "crates/reviewgraphen-core",
    "crates/reviewgraphen-ingest",
    "crates/reviewgraphen-reviewer",
    "crates/reviewgraphen-verifier",
    "crates/reviewgraphen-runtime",
    "crates/reviewgraphen-cli",
    "crates/reviewgraphen-report",
    "crates/reviewgraphen-store",
    "crates/reviewgraphen-benchmark",
    "examples/double-submit-payment/fixture",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
version = "0.1.0"

[workspace.dependencies]
# Product crates opt into these from [dev-dependencies] with `*.workspace = true`.
insta = { version = "=1.42.2", features = ["yaml"] }
proptest = "=1.6.0"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = { version = "=1.0.140", features = ["raw_value"] }
sha2 = "=0.10.9"
thiserror = "=2.0.12"
jsonschema = { version = "=0.30.0", default-features = false }
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
quote = "=1.0.47"
syn = { version = "=2.0.119", features = ["full", "visit"] }
tempfile = "=3.27.0"
toml = { version = "=0.8.23", default-features = false, features = ["parse"] }
rustix = { version = "=1.1.4", features = ["fs", "process", "rand"] }

# New workspace members must opt in with `lints.workspace = true`. The checked-in
# reference fixture intentionally remains unmodified; CI separately denies all
# warnings for every current target.
[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
