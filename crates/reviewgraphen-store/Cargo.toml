[package]
name = "reviewgraphen-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Linux-only durable store boundary for ReviewGraphen"
license = "MIT OR Apache-2.0"

[features]
# Deliberately opt-in fixture material used by cross-crate integration tests.
# It is absent from default production builds and exposes no event authority.
test-support = ["dep:base64", "dep:tempfile"]

[dependencies]
reviewgraphen-core = { path = "../reviewgraphen-core" }
base64 = { version = "=0.22.1", optional = true }
rustix.workspace = true
thiserror.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled", "serialize", "limits"] }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
reviewgraphen-ingest = { path = "../reviewgraphen-ingest" }

[lints]
workspace = true
