[package]
name = "reviewgraphen-runtime"
description = "Frozen ADR 0020 fake-review and ADR 0021 durable M4 orchestration for ReviewGraphen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
reviewgraphen-core = { path = "../reviewgraphen-core", version = "0.1.0" }
reviewgraphen-ingest = { path = "../reviewgraphen-ingest", version = "0.1.0" }
reviewgraphen-reviewer = { path = "../reviewgraphen-reviewer", version = "0.1.0" }
reviewgraphen-verifier = { path = "../reviewgraphen-verifier", version = "0.1.0" }
serde.workspace = true
thiserror.workspace = true
serde_json.workspace = true
jsonschema.workspace = true
quote.workspace = true
proc-macro2.workspace = true
syn.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
reviewgraphen-store = { path = "../reviewgraphen-store", version = "0.1.0", features = ["test-support"] }

[dev-dependencies]
tempfile.workspace = true
