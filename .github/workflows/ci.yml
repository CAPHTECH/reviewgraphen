name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      run_heavy:
        description: Run the scheduled dependency and coverage checks.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  fast:
    name: Fast validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci.txt

      - name: Install Python validator dependency
        run: python -m pip install --requirement requirements/ci.txt

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup component add --toolchain 1.95.0 rustfmt clippy

      - name: Admit pinned Cargo for ingestion E2E tests
        run: |
          trusted_cargo="$(rustup which --toolchain 1.95.0 cargo)"
          test "${trusted_cargo#/}" != "$trusted_cargo"
          test -f "$trusted_cargo"
          test -x "$trusted_cargo"
          test "$(basename -- "$trusted_cargo")" = cargo
          test "$trusted_cargo" = "$(printf '%s' "$trusted_cargo" | tr -d '\r\n')"
          printf 'REVIEWGRAPHEN_TRUSTED_CARGO=%s\n' "$trusted_cargo" >> "$GITHUB_ENV"

      - name: Install nextest
        run: cargo +1.95.0 install cargo-nextest --locked --version 0.9.137

      - name: Run fast checks
        run: ./scripts/ci.sh fast

  macos-cli:
    name: macOS 15 Apple Silicon CLI
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Test portable CLI boundary
        run: cargo +1.95.0 test --locked -p reviewgraphen-cli

      - name: Build release binary
        run: cargo +1.95.0 build --locked --release -p reviewgraphen-cli

      - name: Smoke-test embedded schemas
        run: |
          target/release/reviewgraphen schema list
          target/release/reviewgraphen schema validate schemas/reviewgraphen.responsibility_family_state.v1.example.json

      - name: Test release installer portability
        run: sh scripts/test-install.sh

  scheduled:
    name: Scheduled coverage and dependency policy
    needs: fast
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_heavy)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci.txt

      - name: Install Python validator dependency
        run: python -m pip install --requirement requirements/ci.txt

      - name: Install pinned Rust toolchain and coverage component
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup component add --toolchain 1.95.0 rustfmt clippy llvm-tools-preview

      - name: Admit pinned Cargo for ingestion E2E tests
        run: |
          trusted_cargo="$(rustup which --toolchain 1.95.0 cargo)"
          test "${trusted_cargo#/}" != "$trusted_cargo"
          test -f "$trusted_cargo"
          test -x "$trusted_cargo"
          test "$(basename -- "$trusted_cargo")" = cargo
          test "$trusted_cargo" = "$(printf '%s' "$trusted_cargo" | tr -d '\r\n')"
          printf 'REVIEWGRAPHEN_TRUSTED_CARGO=%s\n' "$trusted_cargo" >> "$GITHUB_ENV"

      - name: Install scheduled check tools
        run: |
          cargo +1.95.0 install cargo-nextest --locked --version 0.9.137
          cargo +1.95.0 install cargo-deny --locked --version 0.18.7
          cargo +1.95.0 install cargo-llvm-cov --locked --version 0.8.6

      - name: Run heavy checks
        run: ./scripts/ci.sh heavy

      - name: Upload LLVM coverage
        if: always() && hashFiles('target/llvm-cov/lcov.info') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: llvm-coverage-${{ github.run_id }}
          path: target/llvm-cov/lcov.info
          if-no-files-found: warn
