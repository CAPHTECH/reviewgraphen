name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare draft release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Require the current, CI-green main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          success="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status completed \
            --json conclusion --jq 'any(.[]; .conclusion == "success")')"
          test "$success" = true

      - name: Match tag to workspace version
        id: version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -1)"
          test -n "$manifest_version"
          test "$tag_version" = "$manifest_version"
          printf 'version=%s\n' "$tag_version" >> "$GITHUB_OUTPUT"

      - name: Test installer
        run: sh scripts/test-install.sh

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "ReviewGraphen $GITHUB_REF_NAME" --generate-notes

      - name: Package installer and agent skill
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          printf 'v%s\n' "$VERSION" > reviewgraphen-version
          tar -czf "reviewgraphen-skill-v$VERSION.tar.gz" -C skills reviewgraphen
          shasum -a 256 "reviewgraphen-skill-v$VERSION.tar.gz" > "reviewgraphen-skill-v$VERSION.tar.gz.sha256"
          shasum -a 256 install.sh > install.sh.sha256

      - name: Upload installer and agent skill
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            install.sh install.sh.sha256 reviewgraphen-version \
            "reviewgraphen-skill-v$VERSION.tar.gz" \
            "reviewgraphen-skill-v$VERSION.tar.gz.sha256" --clobber

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add --toolchain 1.95.0 "${{ matrix.target }}"

      - name: Test CLI
        run: cargo +1.95.0 test --locked -p reviewgraphen-cli

      - name: Build release binary
        run: cargo +1.95.0 build --locked --release --target "${{ matrix.target }}" -p reviewgraphen-cli

      - name: Verify and package binary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          binary="target/$TARGET/release/reviewgraphen"
          test "$("$binary" --version)" = "reviewgraphen $VERSION"
          "$binary" schema list >/dev/null
          package="reviewgraphen-v$VERSION-$TARGET"
          mkdir "$package"
          cp "$binary" LICENSE NOTICE README.md "$package/"
          tar -czf "$package.tar.gz" "$package"
          shasum -a 256 "$package.tar.gz" > "$package.tar.gz.sha256"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          package="reviewgraphen-v$VERSION-$TARGET.tar.gz"
          gh release upload "$GITHUB_REF_NAME" "$package" "$package.sha256" --clobber

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Publish completed draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          --draft=false --latest
